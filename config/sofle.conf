# Enable encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable pointing device support (required for trackpoint in future)
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n

# Input event support (required for pointing devices)
CONFIG_INPUT=y

# Split keyboard support
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# USB HID composite support (keyboard + mouse/pointing)
CONFIG_ZMK_HID_REPORT_ID_HK=y
CONFIG_ZMK_HID_REPORT_ID_SYSTEM=y
CONFIG_ZMK_HID_REPORT_ID_CONSUMER=y

# Uncomment the following line to enable the Sofle OLED Display
# CONFIG_ZMK_DISPLAY=y

# Uncomment this line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n